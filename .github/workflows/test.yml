name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docflow" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/test.sh
      - name: Migrations apply cleanly on PostgreSQL
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://docflow:docflow@localhost:5432/docflow
        run: |
          python -m alembic upgrade head
          python -m alembic check

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g playwright@1.62.1
      - run: playwright install --with-deps chromium
      - run: SKIP_INSTALL=1 ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
